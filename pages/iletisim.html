<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim - Berceste</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="../public/images/bfavicon.png">
    <link rel="shortcut icon" type="image/png" href="../public/images/bfavicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="page-iletisim">
    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                <img src="../public/images/berceste_logo.png" alt="Berceste Logo" class="navbar-logo">
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html#features">Özellikler</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html#download">İndir</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./blog.html">Blog</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="py-5" style="padding-top:120px !important; background: var(--background-white);">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-12">
                    <h1 class="display-5 fw-bold mb-2" style="color: var(--text-dark);">İletişim</h1>
                    <p class="mb-0" style="color: var(--text-light);">Bize dilediğiniz zaman ulaşabilirsiniz.</p>
                </div>
            </div>
        </div>
    </header>

    <main class="container" style="padding-bottom:80px;">
        <div class="row">
            <div class="col-12 contact-wrapper">
                <div class="row g-4">
                    <div class="col-lg-7">
                        <div class="p-4 p-md-5 h-100 contact-card">
                            <form>
                                <div class="mb-3">
                                    <label class="form-label">Adınız Soyadınız</label>
                                    <input type="text" class="form-control" placeholder="Ad Soyad">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">E-posta</label>
                                    <input type="email" class="form-control" placeholder="ornek@eposta.com">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Mesajınız</label>
                                    <textarea rows="6" class="form-control" placeholder="Mesajınızı yazın"></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary">Gönder</button>
                            </form>
                        </div>
                    </div>
                    <div class="col-lg-5">
                        <div class="p-4 p-md-5 h-100 contact-card">
                            <h2 class="h5 fw-bold mb-3">Diğer kanallar</h2>
                            <p class="mb-2"><i class="fa-solid fa-envelope me-2"></i>support@berceste.app</p>
                            <p class="mb-0"><i class="fa-solid fa-globe me-2"></i>berceste.app</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="row">
                <div class="col-12 text-center">
                    <div class="footer-content">
                        <div class="footer-brand-container">
                            <img src="../public/images/berceste_logo.png" alt="Berceste Logo" class="footer-logo">
                            <h3 class="footer-brand">Berceste</h3>
                        </div>
                        <div class="footer-links">
                            <a href="./gizlilik-politikasi.html" class="footer-link">Gizlilik Politikası</a>
                            <a href="./kullanim-sartlari.html" class="footer-link">Kullanım Şartları</a>
                            <a href="./iletisim.html" class="footer-link">İletişim</a>
                            <a href="./hesap-silme.html" class="footer-link">Hesabımı Nasıl Silerim?</a>
                        </div>
                        <div class="footer-links">
                            <a href="./blog.html" class="footer-link">Blog</a>
                        </div>
                        <div class="footer-copyright">
                            <p>&copy; 2025 Berceste. Tüm hakları saklıdır.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
